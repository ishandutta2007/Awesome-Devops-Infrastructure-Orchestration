<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .pulse-orb-1 {
        animation: floatOrb1 8s ease-in-out infinite alternate;
      }
      .pulse-orb-2 {
        animation: floatOrb2 10s ease-in-out infinite alternate;
      }
      .orbit-particle {
        animation: particleRun 6s linear infinite;
      }
      .orbit-particle-rev {
        animation: particleRunRev 8s linear infinite;
      }
      .glow-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 20s linear infinite;
      }
      .wave-line-rev {
        stroke-dasharray: 6 6;
        animation: dashFlowRev 15s linear infinite;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(40px, -20px) scale(1.2); opacity: 0.55; }
        100% { transform: translate(-30px, 30px) scale(0.9); opacity: 0.3; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
        50% { transform: translate(-50px, -25px) scale(1.3); opacity: 0.45; }
        100% { transform: translate(30px, 20px) scale(0.85); opacity: 0.2; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 1000; }
      }
      @keyframes dashFlowRev {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulsePill {
        0% { opacity: 0.75; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Ambient Orbs (strictly background) -->
  <g class="pulse-orb-1" filter="url(#glowOrb)">
    <circle cx="200" cy="120" r="140" fill="#0284c7" opacity="0.25" />
    <circle cx="1020" cy="300" r="120" fill="#6366f1" opacity="0.2" />
  </g>
  <g class="pulse-orb-2" filter="url(#glowOrb)">
    <circle cx="950" cy="100" r="130" fill="#a855f7" opacity="0.2" />
    <circle cx="280" cy="340" r="110" fill="#06b6d4" opacity="0.25" />
  </g>

  <!-- Dynamic Animated Orchestration Wave/Flow Lines in background -->
  <g opacity="0.6">
    <path class="wave-line" d="M -50 180 Q 250 80, 550 210 T 1250 160" fill="none" stroke="url(#cyanLine)" stroke-width="2.5" />
    <path class="wave-line-rev" d="M -50 250 Q 300 350, 650 200 T 1250 260" fill="none" stroke="url(#purpleLine)" stroke-width="2" />
    <path class="wave-line" d="M 100 430 C 350 280, 850 450, 1150 180" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
  </g>

  <!-- Animated Data Flow Particles -->
  <circle r="4" fill="#38bdf8" filter="url(#glowCyan)">
    <animateMotion repeatCount="indefinite" dur="8s" path="M -50 180 Q 250 80, 550 210 T 1250 160" />
  </circle>
  <circle r="3.5" fill="#c084fc" filter="url(#glowCyan)">
    <animateMotion repeatCount="indefinite" dur="11s" path="M -50 250 Q 300 350, 650 200 T 1250 260" />
  </circle>
  <circle r="3" fill="#34d399" filter="url(#glowCyan)">
    <animateMotion repeatCount="indefinite" dur="9s" path="M 100 430 C 350 280, 850 450, 1150 180" />
  </circle>

  <!-- High-contrast Badge / Top Pill in Foreground -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="-150" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-135" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Foreground Title (always stays crystal clear & in front) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      DevOps &amp; Infrastructure Orchestration
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 202)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="url(#subGrad)" letter-spacing="0.2">
      Infrastructure-as-Code (IaC) • TACOS • GitOps Automation • Multi-Cloud Orchestration
    </text>
  </g>

  <!-- Ecosystem Feature Pills (Row of Capabilities) in Foreground -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Pill 1: OpenTofu & Terraform -->
    <g transform="translate(-400, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">⚡ OpenTofu &amp; Terraform</text>
    </g>

    <!-- Pill 2: Pulumi & CDK -->
    <g transform="translate(-200, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ede9fe">🛠️ Pulumi &amp; Cloud CDK</text>
    </g>

    <!-- Pill 3: GitOps & CI/CD -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">🔄 GitOps &amp; TACOS</text>
    </g>

    <!-- Pill 4: Policy & Guardrails -->
    <g transform="translate(200, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">🛡️ Policy-as-Code &amp; FinOps</text>
    </g>

    <!-- Pill 5: Kubernetes & Cloud -->
    <g transform="translate(400, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">☁️ Multi-Cloud &amp; K8s</text>
    </g>
  </g>

  <!-- Bottom Interactive / Stats Metrics Line -->
  <g transform="translate(600, 340)" text-anchor="middle">
    <rect x="-360" y="-22" width="720" height="44" rx="22" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      <tspan fill="#38bdf8" font-weight="700">★ Open Source &amp; Hosted</tspan>  •  
      <tspan fill="#a78bfa" font-weight="700">Continuous Drift Detection</tspan>  •  
      <tspan fill="#34d399" font-weight="700">Zero Lock-In Blueprints</tspan>
    </text>
  </g>
</svg>
